# Example owned native pair delta generated automatically when the bundle is installed/enabled.
# No normal profile/installed package changed. Values are sanitized if marked <USER_WORKSPACE>.
- id: tool-plugin-manager
  name: "@deepseek-ai/dsh-plugin-manager/tools"
  disabled: true
- insert:
    - id: workspace-guard-tool-plugin-manager-2f3a2ef4
      name: "@cleverpig/dsh-workspace-guard/plugin-tools"
      disabled: true
- id: sandbox
  name: "@deepseek-ai/dsh-sandbox-local"
  disabled: true
- insert:
    - id: workspace-guard-sandbox-8d8ebad1
      name: "@cleverpig/dsh-workspace-guard/sandbox"
- id: sandbox-policy
  name: "@deepseek-ai/dsh-sandbox-policy"
  disabled: true
- insert:
    - id: workspace-guard-sandbox-policy-63ef2768
      name: "@cleverpig/dsh-workspace-guard/policy"
      config:
        mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
        workspaceRoot: !!js "process.cwd()"
- id: approval
  name: "@deepseek-ai/dsh-user-approval"
  disabled: true
- insert:
    - id: workspace-guard-approval-682cffe7
      name: "@cleverpig/dsh-workspace-guard/approval"
      config:
        policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  disabled: true
- insert:
    - id: workspace-guard-permission-8bfcb65f
      name: "@cleverpig/dsh-workspace-guard/permission"
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never
